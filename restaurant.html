<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم المذاق الفريد</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #fafafa; color: #333; text-align: center; }
        header { background: #e63946; color: white; padding: 40px 20px; }
        h1 { margin: 0; font-size: 2rem; }
        p { font-size: 1.1rem; }
        .btn { display: inline-block; background: #ffb703; color: #000; padding: 12px 24px; margin-top: 15px; text-decoration: none; border-radius: 25px; font-weight: bold; }
        .features { display: flex; flex-direction: column; gap: 15px; padding: 30px 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        footer { background: #1d3557; color: white; padding: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1>مطعم المذاق الفريد</h1>
        <p>أشهى الوجبات السريعة والطازجة تصلك حتى باب منزلك!</p>
        <a href="tel:000000000" class="btn">اطلب الآن</a>
    </header>

    <section class="features">
        <div class="card">
            <h3>جودة عالية</h3>
            <p>نستخدم أفضل المكونات الطازجة يومياً.</p>
        </div>
        <div class="card">
            <h3>توصيل سريع</h3>
            <p>صلك طلبيتك ساخنة في أقل من 30 دقيقة.</p>
        </div>
        <div class="card">
            <h3>عروض يومية</h3>
            <p>خصومات حصرية تصل إلى 30% على الطلبات العائلية.</p>
        </div>
    </section>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 - مطعم المذاق الفريد</p>
    </footer>

</body>
</html>
